<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扇形重叠可视化</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --a: #2563eb; --b: #ea7a0c; --ov: #dc2656;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink); background: var(--bg); display: flex; overflow: hidden;
  }
  #stage { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #tools { position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  #readout {
    position: absolute; right: 12px; bottom: 10px; pointer-events: none;
    font: 12px ui-monospace, Consolas, monospace; color: var(--muted);
    background: rgba(255,255,255,.88); padding: 3px 8px; border-radius: 6px;
  }
  #toast {
    position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 5px 12px; border-radius: 7px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  button {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 5px 10px; border-radius: 7px; cursor: pointer;
  }
  button:hover { border-color: #cbd5e1; background: #f8fafc; }
  aside {
    width: 330px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 16px 16px 24px;
  }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 12px; }
  section { border-top: 1px solid var(--line); padding: 12px 0; }
  h2 {
    font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
  .card { border-left: 3px solid transparent; padding-left: 10px; margin-left: -13px; }
  .card.sel { border-left-color: var(--c); }
  .card.sel h2 { color: var(--ink); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  label.f { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 11px; }
  input[type=number] {
    width: 100%; font: 12px ui-monospace, Consolas, monospace; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--ink); background: #fff;
  }
  input[type=number]:focus { outline: 2px solid #bfdbfe; border-color: #93c5fd; }
  input.bad { border-color: #f87171; background: #fef2f2; }
  .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 3px 0; }
  td.v { text-align: right; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  tr.hl td { font-weight: 700; color: var(--ov); }
  .help { color: var(--muted); font-size: 12px; margin: 0; padding-left: 16px; }
  .help li { margin: 2px 0; }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: #f8fafc; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    #stage { flex: 1 1 55%; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="tools">
    <button id="btnFit">适应视图</button>
    <button id="btnFocus">聚焦重叠区</button>
    <button id="btnZoomIn" title="放大">＋</button>
    <button id="btnZoomOut" title="缩小">－</button>
    <button id="btnReset">重置</button>
  </div>
  <div id="toast"></div>
  <div id="readout">—</div>
</div>

<aside>
  <h1>扇形重叠</h1>
  <p class="sub" id="subtitle"></p>

  <div id="cards"></div>

  <section>
    <h2><span class="sw" style="background:var(--ov)"></span>面积统计</h2>
    <table id="stats"></table>
  </section>

  <section>
    <h2>全局参数</h2>
    <div class="grid2">
      <label class="f">圆半径 (m)<input type="number" id="pR" step="10"></label>
      <label class="f">扇形张角 (°)<input type="number" id="pWidth" step="0.1"></label>
      <label class="f">扇形内半径 (m)<input type="number" id="pRIn" step="1"></label>
      <label class="f">扇形外半径 (m)<input type="number" id="pROut" step="10"></label>
    </div>
  </section>

  <section>
    <h2>操作</h2>
    <ul class="help">
      <li>拖动扇形或实心顶点：平移</li>
      <li>拖动末端空心圆点，或 <kbd>Shift</kbd>/右键 拖动扇形：绕顶点旋转</li>
      <li>滚轮：缩放；拖动空白处：平移视图</li>
      <li><kbd>1</kbd>/<kbd>2</kbd> 选择扇形，方向键移动 1 m（<kbd>Shift</kbd> 10 m）</li>
      <li><kbd>Q</kbd>/<kbd>E</kbd> 逆/顺时针旋转 0.1°（<kbd>Shift</kbd> 1°）</li>
      <li>方向角：0° 指向 +X，逆时针为正</li>
    </ul>
  </section>
</aside>

<script>
(() => {
  const DEG = Math.PI / 180;
  const OV = '#dc2656';
  const DEFAULTS = {
    P: { R: 1800, rIn: 5, rOut: 1500, width: 2 },
    S: [
      { x: 600,  y: 200,  h: 20,  clip: true  },
      { x: 1650, y: -950, h: 105, clip: false },
    ],
  };
  const STYLE = [
    { key: 'A', color: '#2563eb', fill: 'rgba(37,99,235,0.22)' },
    { key: 'B', color: '#ea7a0c', fill: 'rgba(234,122,12,0.22)' },
  ];
  const MIN_SCALE = 0.002, MAX_SCALE = 400;   // px per metre

  let P, S;
  let selected = 0;
  const view = { cx: 0, cy: 0, scale: 0.2 };

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  let W = 0, H = 0, DPR = 1;

  function reset() {
    P = { ...DEFAULTS.P };
    S = DEFAULTS.S.map((s, i) => ({ ...s, ...STYLE[i] }));
    selected = 0;
  }

  // ---------- coordinates ----------
  const toScreen = (x, y) => [W / 2 + (x - view.cx) * view.scale, H / 2 - (y - view.cy) * view.scale];
  const toWorld = (sx, sy) => [view.cx + (sx - W / 2) / view.scale, view.cy - (sy - H / 2) / view.scale];
  const normDeg = v => Math.round((((v % 360) + 360) % 360) * 1e6) / 1e6;

  // ---------- geometry (for area) ----------
  function sectorPoly(s) {
    const n = Math.min(720, Math.max(16, Math.ceil(P.width / 0.01)));
    const a0 = (s.h - P.width / 2) * DEG, a1 = (s.h + P.width / 2) * DEG;
    const pts = [];
    for (let k = 0; k <= n; k++) {
      const a = a0 + (a1 - a0) * k / n;
      pts.push([s.x + P.rOut * Math.cos(a), s.y + P.rOut * Math.sin(a)]);
    }
    // inner arc as a chord keeps the polygon convex (error is negligible for small rIn)
    pts.push([s.x + P.rIn * Math.cos(a1), s.y + P.rIn * Math.sin(a1)]);
    pts.push([s.x + P.rIn * Math.cos(a0), s.y + P.rIn * Math.sin(a0)]);
    return pts;
  }

  let circleCache = { R: -1, pts: null };
  function circlePoly() {
    if (circleCache.R === P.R) return circleCache.pts;
    const n = 2048;
    // radius chosen so the polygon's area equals the true circle's area
    const r = P.R * Math.sqrt(2 * Math.PI / (n * Math.sin(2 * Math.PI / n)));
    const pts = [];
    for (let k = 0; k < n; k++) {
      const a = 2 * Math.PI * k / n;
      pts.push([r * Math.cos(a), r * Math.sin(a)]);
    }
    circleCache = { R: P.R, pts };
    return pts;
  }

  // Sutherland–Hodgman: clip `subject` by convex CCW polygon `clip`
  function clipConvex(subject, clip) {
    let out = subject;
    for (let i = 0; i < clip.length && out.length; i++) {
      const [ax, ay] = clip[i], [bx, by] = clip[(i + 1) % clip.length];
      const ex = bx - ax, ey = by - ay;
      const inp = out; out = [];
      for (let j = 0; j < inp.length; j++) {
        const p = inp[j], q = inp[(j + 1) % inp.length];
        const sp = ex * (p[1] - ay) - ey * (p[0] - ax);
        const sq = ex * (q[1] - ay) - ey * (q[0] - ax);
        if (sp >= 0) out.push(p);
        if ((sp >= 0) !== (sq >= 0)) {
          const t = sp / (sp - sq);
          out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
        }
      }
    }
    return out;
  }

  function clipByCircle(poly) {
    const r2 = P.R * P.R;
    if (poly.every(([x, y]) => x * x + y * y <= r2)) return poly;
    return clipConvex(poly, circlePoly());
  }

  function polyArea(p) {
    let a = 0;
    for (let i = 0; i < p.length; i++) {
      const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length];
      a += x1 * y2 - x2 * y1;
    }
    return Math.abs(a) / 2;
  }

  function polyCentroid(p) {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < p.length; i++) {
      const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length];
      const c = x1 * y2 - x2 * y1;
      a += c; cx += (x1 + x2) * c; cy += (y1 + y2) * c;
    }
    if (Math.abs(a) < 1e-12) return p.length ? p[0] : [0, 0];
    return [cx / (3 * a), cy / (3 * a)];
  }

  let geo = null, geoDirty = true;
  function ensureGeo() {
    if (!geoDirty && geo) return;
    const polys = S.map(sectorPoly);
    const vis = polys.map((p, i) => (S[i].clip ? clipByCircle(p) : p));
    let ov = polys[0].length >= 3 ? clipConvex(polys[0], polys[1]) : [];
    if (ov.length >= 3 && (S[0].clip || S[1].clip)) ov = clipByCircle(ov);
    if (ov.length < 3) ov = [];
    geo = {
      polys, vis, ov,
      areaFull: P.width * DEG / 2 * (P.rOut * P.rOut - P.rIn * P.rIn),
      areaVis: vis.map(v => (v.length >= 3 ? polyArea(v) : 0)),
      areaOv: ov.length ? polyArea(ov) : 0,
      cen: ov.length ? polyCentroid(ov) : null,
    };
    geoDirty = false;
    renderStats();
  }

  // ---------- hit testing ----------
  function distToSector(s, px, py) {
    const dx = px - s.x, dy = py - s.y, r = Math.hypot(dx, dy);
    const half = P.width / 2 * DEG;
    let rel = Math.atan2(dy, dx) - s.h * DEG;
    rel = Math.atan2(Math.sin(rel), Math.cos(rel));
    if (Math.abs(rel) <= half) {
      if (r >= P.rIn && r <= P.rOut) return 0;
      return r < P.rIn ? P.rIn - r : r - P.rOut;
    }
    // outside the angular range: nearest point lies on the angularly nearer radial edge
    const a = s.h * DEG + (rel > 0 ? half : -half);
    const ux = Math.cos(a), uy = Math.sin(a);
    const t = Math.max(P.rIn, Math.min(P.rOut, dx * ux + dy * uy));
    return Math.hypot(dx - ux * t, dy - uy * t);
  }

  const tipOf = s => [s.x + P.rOut * Math.cos(s.h * DEG), s.y + P.rOut * Math.sin(s.h * DEG)];

  function hitTest(sx, sy) {
    const order = [selected, ...S.map((_, i) => i).filter(i => i !== selected)];
    for (const i of order) {
      const s = S[i];
      const [tx, ty] = toScreen(...tipOf(s));
      if (Math.hypot(sx - tx, sy - ty) <= 10) return { i, mode: 'rotate' };
      const [ax, ay] = toScreen(s.x, s.y);
      if (Math.hypot(sx - ax, sy - ay) <= 10) return { i, mode: 'move' };
    }
    const [wx, wy] = toWorld(sx, sy);
    const tol = 6 / view.scale;
    let best = null;
    for (const i of order) {
      const s = S[i];
      if (s.clip && Math.hypot(wx, wy) > P.R + tol) continue;
      const d = distToSector(s, wx, wy);
      if (d <= tol && (!best || d < best.d)) best = { i, mode: 'move', d };
    }
    return best;
  }

  // ---------- drawing ----------
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
  }
  function fmtLen(v) {
    v = +v.toPrecision(6);
    if (v >= 1000) return +(v / 1000).toPrecision(6) + ' km';
    if (v >= 1) return v + ' m';
    return +(v * 100).toPrecision(6) + ' cm';
  }

  function circlePath() {
    const [cx, cy] = toScreen(0, 0);
    ctx.beginPath();
    ctx.arc(cx, cy, P.R * view.scale, 0, 2 * Math.PI);
  }

  function sectorPath(s) {
    const [px, py] = toScreen(s.x, s.y);
    const a0 = (s.h - P.width / 2) * DEG, a1 = (s.h + P.width / 2) * DEG;
    // canvas y points down, so world angle θ maps to canvas angle −θ
    ctx.beginPath();
    ctx.arc(px, py, P.rOut * view.scale, -a0, -a1, true);
    ctx.arc(px, py, P.rIn * view.scale, -a1, -a0, false);
    ctx.closePath();
  }

  function drawGrid() {
    const step = niceStep(90 / view.scale);
    const [x0, y1] = toWorld(0, 0), [x1, y0] = toWorld(W, H);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#e8ebf0';
    ctx.beginPath();
    for (let k = Math.ceil(x0 / step); k * step <= x1; k++) {
      const sx = Math.round(toScreen(k * step, 0)[0]) + 0.5;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
    }
    for (let k = Math.ceil(y0 / step); k * step <= y1; k++) {
      const sy = Math.round(toScreen(0, k * step)[1]) + 0.5;
      ctx.moveTo(0, sy); ctx.lineTo(W, sy);
    }
    ctx.stroke();
    const [ox, oy] = toScreen(0, 0);
    ctx.strokeStyle = '#cfd5de';
    ctx.beginPath();
    ctx.moveTo(Math.round(ox) + 0.5, 0); ctx.lineTo(Math.round(ox) + 0.5, H);
    ctx.moveTo(0, Math.round(oy) + 0.5); ctx.lineTo(W, Math.round(oy) + 0.5);
    ctx.stroke();
  }

  function drawSectorBody(s, i) {
    ctx.save();
    if (s.clip) { circlePath(); ctx.clip(); }
    sectorPath(s);
    ctx.fillStyle = s.fill;
    ctx.fill();
    ctx.lineJoin = 'round';
    ctx.lineWidth = i === selected ? 2 : 1.25;
    ctx.strokeStyle = s.color;
    ctx.stroke();
    ctx.restore();
  }

  function drawOverlap() {
    if (!geo.ov.length) return;
    ctx.save();
    if (S.some(s => s.clip)) { circlePath(); ctx.clip(); }
    sectorPath(S[0]); ctx.clip();
    sectorPath(S[1]);
    ctx.fillStyle = OV;
    ctx.fill();
    ctx.restore();

    // mark overlaps that are too small to see at the current zoom
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const [x, y] of geo.ov) {
      const [sx, sy] = toScreen(x, y);
      minx = Math.min(minx, sx); maxx = Math.max(maxx, sx);
      miny = Math.min(miny, sy); maxy = Math.max(maxy, sy);
    }
    if (Math.max(maxx - minx, maxy - miny) < 10) {
      const [cx, cy] = toScreen(...geo.cen);
      ctx.beginPath();
      ctx.arc(cx, cy, 12, 0, 2 * Math.PI);
      ctx.lineWidth = 2;
      ctx.strokeStyle = OV;
      ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawHandles(s, i) {
    const sel = i === selected;
    const [ax, ay] = toScreen(s.x, s.y);
    const [tx, ty] = toScreen(...tipOf(s));

    ctx.beginPath();
    ctx.arc(tx, ty, sel ? 6 : 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = s.color; ctx.stroke();

    ctx.beginPath();
    ctx.arc(ax, ay, sel ? 7 : 5.5, 0, 2 * Math.PI);
    ctx.fillStyle = s.color; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

    const lx = ax - Math.cos(s.h * DEG) * 18, ly = ay + Math.sin(s.h * DEG) * 18;
    ctx.font = '700 13px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(s.key, lx, ly);
    ctx.fillStyle = s.color;
    ctx.fillText(s.key, lx, ly);
  }

  function drawScaleBar() {
    const len = niceStep(100 / view.scale), px = len * view.scale;
    const x = 16, y = H - 18;
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y - 5); ctx.lineTo(x, y); ctx.lineTo(x + px, y); ctx.lineTo(x + px, y - 5);
    ctx.stroke();
    ctx.fillStyle = '#334155';
    ctx.font = '12px system-ui, "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(fmtLen(len), x, y - 7);
  }

  function draw() {
    ensureGeo();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#f6f7f9';
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    circlePath();
    ctx.fillStyle = 'rgba(15,23,42,0.025)';
    ctx.fill();

    S.forEach(drawSectorBody);
    drawOverlap();

    circlePath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();

    const [ox, oy] = toScreen(0, 0);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ox - 6, oy); ctx.lineTo(ox + 6, oy);
    ctx.moveTo(ox, oy - 6); ctx.lineTo(ox, oy + 6);
    ctx.stroke();

    S.forEach((s, i) => { if (i !== selected) drawHandles(s, i); });
    drawHandles(S[selected], selected);
    drawScaleBar();
  }

  let raf = 0;
  const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); };
  function changed() { geoDirty = true; syncPanel(); schedule(); }

  // ---------- view ----------
  let animToken = 0;
  function animateTo(tcx, tcy, ts) {
    ts = Math.min(MAX_SCALE, Math.max(MIN_SCALE, ts));
    const s0 = { ...view }, t0 = performance.now(), dur = 450, token = ++animToken;
    const step = now => {
      if (token !== animToken) return;
      const u = Math.min(1, (now - t0) / dur);
      const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      view.scale = Math.exp(Math.log(s0.scale) + (Math.log(ts) - Math.log(s0.scale)) * e);
      view.cx = s0.cx + (tcx - s0.cx) * e;
      view.cy = s0.cy + (tcy - s0.cy) * e;
      draw();
      if (u < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function fitBox(minx, miny, maxx, maxy, fill, animate) {
    const pad = 56;
    const bw = Math.max(maxx - minx, 1e-6), bh = Math.max(maxy - miny, 1e-6);
    const sc = Math.min((W - 2 * pad) / bw, (H - 2 * pad) / bh) * fill;
    const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
    if (animate) animateTo(cx, cy, sc);
    else { view.cx = cx; view.cy = cy; view.scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, sc)); schedule(); }
  }

  function bbox(points) {
    let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
    for (const [x, y] of points) {
      minx = Math.min(minx, x); maxx = Math.max(maxx, x);
      miny = Math.min(miny, y); maxy = Math.max(maxy, y);
    }
    return [minx, miny, maxx, maxy];
  }

  function fitView(animate) {
    ensureGeo();
    const pts = [[-P.R, -P.R], [P.R, P.R]];
    geo.vis.forEach(v => pts.push(...v));
    S.forEach(s => { pts.push([s.x, s.y], tipOf(s)); });
    fitBox(...bbox(pts), 1, animate);
  }

  function focusOverlap() {
    ensureGeo();
    if (!geo.ov.length) { toast('当前没有重叠区域'); return; }
    fitBox(...bbox(geo.ov), 0.7, true);
  }

  function zoomAt(sx, sy, k) {
    animToken++;
    const [wx, wy] = toWorld(sx, sy);
    view.scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, view.scale * k));
    view.cx = wx - (sx - W / 2) / view.scale;
    view.cy = wy + (sy - H / 2) / view.scale;
    schedule();
  }

  let toastTimer = 0;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.opacity = 1;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.style.opacity = 0; }, 1600);
  }

  // ---------- pointer interaction ----------
  let drag = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const readout = document.getElementById('readout');

  cv.addEventListener('contextmenu', e => e.preventDefault());

  cv.addEventListener('pointerdown', e => {
    animToken++;
    const [sx, sy] = pos(e);
    const hit = hitTest(sx, sy);
    cv.setPointerCapture(e.pointerId);
    if (hit) {
      selected = hit.i;
      const s = S[hit.i];
      const [wx, wy] = toWorld(sx, sy);
      const mode = hit.mode === 'move' && (e.shiftKey || e.button === 2) ? 'rotate' : hit.mode;
      drag = { mode, i: hit.i, ox: wx - s.x, oy: wy - s.y, a0: Math.atan2(wy - s.y, wx - s.x), h0: s.h };
      cv.style.cursor = mode === 'rotate' ? 'crosshair' : 'move';
      syncPanel();
    } else {
      drag = { mode: 'pan', sx, sy, cx: view.cx, cy: view.cy };
      cv.style.cursor = 'grabbing';
    }
    schedule();
  });

  cv.addEventListener('pointermove', e => {
    const [sx, sy] = pos(e);
    const [wx, wy] = toWorld(sx, sy);
    readout.textContent = `x ${wx.toFixed(1)}  y ${wy.toFixed(1)}  r ${Math.hypot(wx, wy).toFixed(1)} m`;

    if (!drag) {
      const hit = hitTest(sx, sy);
      cv.style.cursor = !hit ? 'default' : hit.mode === 'rotate' || e.shiftKey ? 'crosshair' : 'move';
      return;
    }
    if (drag.mode === 'pan') {
      view.cx = drag.cx - (sx - drag.sx) / view.scale;
      view.cy = drag.cy + (sy - drag.sy) / view.scale;
      schedule();
      return;
    }
    const s = S[drag.i];
    if (drag.mode === 'move') {
      s.x = wx - drag.ox;
      s.y = wy - drag.oy;
    } else {
      const a = Math.atan2(wy - s.y, wx - s.x);
      s.h = normDeg(drag.h0 + (a - drag.a0) / DEG);
    }
    changed();
  });

  const endDrag = e => {
    if (!drag) return;
    drag = null;
    if (cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId);
    cv.style.cursor = 'default';
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const [sx, sy] = pos(e);
    zoomAt(sx, sy, Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement) return;
    const s = S[selected];
    const m = e.shiftKey ? 10 : 1, r = e.shiftKey ? 1 : 0.1;
    switch (e.key) {
      case 'ArrowLeft': s.x -= m; break;
      case 'ArrowRight': s.x += m; break;
      case 'ArrowUp': s.y += m; break;
      case 'ArrowDown': s.y -= m; break;
      case 'q': case 'Q': s.h = normDeg(s.h + r); break;
      case 'e': case 'E': s.h = normDeg(s.h - r); break;
      case '1': selected = 0; break;
      case '2': selected = 1; break;
      default: return;
    }
    e.preventDefault();
    changed();
  });

  document.getElementById('btnFit').onclick = () => fitView(true);
  document.getElementById('btnFocus').onclick = focusOverlap;
  document.getElementById('btnZoomIn').onclick = () => zoomAt(W / 2, H / 2, 1.6);
  document.getElementById('btnZoomOut').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.6);
  document.getElementById('btnReset').onclick = () => { reset(); changed(); syncParams(); fitView(true); };

  // ---------- panel ----------
  const cardsEl = document.getElementById('cards');
  const statsEl = document.getElementById('stats');

  S = null; reset();
  S.forEach((s, i) => {
    const sec = document.createElement('section');
    sec.className = 'card';
    sec.style.setProperty('--c', s.color);
    sec.innerHTML = `
      <h2><span class="sw" style="background:${s.color}"></span>扇形 ${s.key}</h2>
      <div class="grid3">
        <label class="f">顶点 X (m)<input type="number" data-i="${i}" data-k="x" step="1"></label>
        <label class="f">顶点 Y (m)<input type="number" data-i="${i}" data-k="y" step="1"></label>
        <label class="f">方向 (°)<input type="number" data-i="${i}" data-k="h" step="0.1"></label>
      </div>
      <label class="chk"><input type="checkbox" data-i="${i}" data-k="clip">圆外部分不显示</label>`;
    sec.addEventListener('pointerdown', () => { if (selected !== i) { selected = i; syncPanel(); schedule(); } });
    cardsEl.appendChild(sec);
  });

  cardsEl.addEventListener('input', e => {
    const t = e.target, k = t.dataset.k;
    if (!k) return;
    const s = S[+t.dataset.i];
    if (k === 'clip') s.clip = t.checked;
    else {
      const v = parseFloat(t.value);
      if (!Number.isFinite(v)) return;
      s[k] = k === 'h' ? normDeg(v) : v;
    }
    changed();
  });

  function syncPanel() {
    cardsEl.querySelectorAll('.card').forEach((c, i) => c.classList.toggle('sel', i === selected));
    cardsEl.querySelectorAll('input').forEach(inp => {
      if (inp === document.activeElement) return;
      const s = S[+inp.dataset.i], k = inp.dataset.k;
      if (k === 'clip') inp.checked = s.clip;
      else inp.value = k === 'h' ? +s.h.toFixed(3) : +s[k].toFixed(2);
    });
  }

  const paramInputs = { R: 'pR', width: 'pWidth', rIn: 'pRIn', rOut: 'pROut' };
  function paramsValid(q) {
    return q.R > 0 && q.rIn >= 0 && q.rOut > q.rIn && q.width > 0 && q.width < 180;
  }
  function syncParams() {
    for (const [k, id] of Object.entries(paramInputs)) {
      const el = document.getElementById(id);
      el.value = P[k];
      el.classList.remove('bad');
    }
    renderSubtitle();
  }
  for (const [k, id] of Object.entries(paramInputs)) {
    document.getElementById(id).addEventListener('input', e => {
      const q = { ...P, [k]: parseFloat(e.target.value) };
      const ok = Object.values(q).every(Number.isFinite) && paramsValid(q);
      e.target.classList.toggle('bad', !ok);
      if (!ok) return;
      Object.values(paramInputs).forEach(i => document.getElementById(i).classList.remove('bad'));
      P = q;
      renderSubtitle();
      changed();
    });
  }
  function renderSubtitle() {
    document.getElementById('subtitle').textContent =
      `圆半径 ${P.R} m · 扇形 ${P.rIn}–${P.rOut} m · 张角 ${P.width}°`;
  }

  const fmtNum = (v, d) => v.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const fmtArea = v => fmtNum(v, 2) + ' m²';
  const pct = (a, b) => (b > 0 ? fmtNum(a / b * 100, 3) + ' %' : '—');

  function renderStats() {
    const [a, b] = S;
    const rows = [
      ['单个扇形理论面积', fmtArea(geo.areaFull)],
      [`A ${a.clip ? '圆内可见' : ''}面积`, fmtArea(geo.areaVis[0])],
      [`B ${b.clip ? '圆内可见' : ''}面积`, fmtArea(geo.areaVis[1])],
      ['重叠面积', fmtArea(geo.areaOv), 'hl'],
      ['重叠 / A 可见', pct(geo.areaOv, geo.areaVis[0])],
      ['重叠 / B 可见', pct(geo.areaOv, geo.areaVis[1])],
      ['A、B 顶点间距', fmtNum(Math.hypot(a.x - b.x, a.y - b.y), 1) + ' m'],
      ['A 顶点到圆心', fmtNum(Math.hypot(a.x, a.y), 1) + ' m'],
      ['B 顶点到圆心', fmtNum(Math.hypot(b.x, b.y), 1) + ' m'],
    ];
    if (geo.cen) rows.push(['重叠区质心', `(${fmtNum(geo.cen[0], 1)}, ${fmtNum(geo.cen[1], 1)})`]);
    statsEl.innerHTML = rows
      .map(([k, v, cls]) => `<tr${cls ? ` class="${cls}"` : ''}><td>${k}</td><td class="v">${v}</td></tr>`)
      .join('');
  }

  // ---------- boot ----------
  let first = true;
  function resize() {
    const r = stage.getBoundingClientRect();
    DPR = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    if (first) { first = false; fitView(false); }
    draw();
  }
  new ResizeObserver(resize).observe(stage);
  syncParams();
  syncPanel();
})();
</script>
</body>
</html>
